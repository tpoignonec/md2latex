# QMS Template Default Metadata
# This provides default pandoc metadata for QMS documents

copyright_holder: ICube 2025

# LaTeX Document Settings
documentclass: "report"
classoption: ["oneside"]
geometry: ["margin=2.5cm"]
fontsize: "11pt"
linestretch: 1.25
papersize: "a4paper"
secnumdepth: 3
indent: true

# Table of Contents
toc: true
toc-depth: 2
toc-title: "Table of Contents"

# Typography
numbersections: true

# Links and Colors
colorlinks: false  # QMS documents often prefer no colored links

# Bibliography defaults
biblio-style: "ieee"
biblio-title: "References"
link-citations: true

# Headers and footers for QMS documents
header-left: "\\VarAuthor"
header-center: "\\VarTitle"
header-right: "Version \\VarRevisionNumber"
footer-left: ""
footer-center: "\\thepage"
footer-right: ""
header-rule-width: "0.4pt"
footer-rule-width: "0pt"

# Template includes
titlepage: "titlepage.tex"
include-after-body: "appendix.tex"

# Custom LaTeX includes
header-includes: ""