# Simple Template Default Metadata
# This provides default pandoc metadata for simple documents

# LaTeX Document Settings
documentclass: "article"
classoption: ["oneside"]
geometry: ["margin=1in"]
fontsize: "11pt"
linestretch: 1.25
papersize: "a4paper"
secnumdepth: 3
indent: true

# Table of Contents
toc: true
toc-depth: 2
toc-title: "Table of Contents"

# Typography
numbersections: true

# Links and Colors
colorlinks: true
linkcolor: "blue"
urlcolor: "blue"
citecolor: "blue"

# Bibliography defaults
biblio-style: "ieee"
biblio-title: "References"
link-citations: true

# Template includes
include-before-body: "titlepage.tex"
include-after-body: "appendix.tex"

# Custom LaTeX includes for better Unicode support
header-includes: |
  \usepackage[utf8]{inputenc}
  \usepackage[T1]{fontenc}
  \usepackage{textcomp}
  \usepackage{lmodern}