# Simple Template Default Metadata
# This provides default pandoc metadata for simple documents

# LaTeX Document Settings
documentclass: "article"
classoption: ["oneside"]
geometry: ["margin=1in"]
fontsize: "11pt"
linestretch: 1.25
papersize: "a4paper"
secnumdepth: 3
indent: true

# Table of Contents
toc: true
toc-depth: 2
toc-title: "Table of Contents"

# Typography
numbersections: true

# Links and Colors
colorlinks: true
linkcolor: "blue"
urlcolor: "blue"
citecolor: "blue"

# Bibliography defaults
biblio-style: "ieee"
biblio-title: "References"
link-citations: true

# Simple headers and footers
header-left: ""
header-center: "\\VarTitle"
header-right: ""
footer-left: ""
footer-center: "\\thepage"
footer-right: ""
header-rule-width: "0.4pt"
footer-rule-width: "0pt"

# Template includes
titlepage: "titlepage.tex"
include-after-body: "appendix.tex"

# Custom LaTeX includes
header-includes: ""