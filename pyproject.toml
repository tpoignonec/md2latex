[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "md2latex"
dynamic = ["version"]
description = "A Python library for generating PDF documents from Markdown files using LaTeX templates"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Thibault Poignonec", email = "Thibault.poignonec@gmail.com"}
]
maintainers = [
    {name = "Thibault Poignonec", email = "Thibault.poignonec@gmail.com"}
]
keywords = ["markdown", "latex", "pdf", "pandoc", "template", "document"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.8"
dependencies = [
    "PyYAML>=5.4.0",
    "Jinja2>=3.0.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "black",
    "flake8",
    "mypy",
    "pre-commit",
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme",
    "sphinx-autodoc-typehints",
]

[project.urls]
Homepage = "https://github.com/tpoignonec/md2latex"
Documentation = "https://md2latex.readthedocs.io/"
Repository = "https://github.com/tpoignonec/md2latex.git"
"Bug Tracker" = "https://github.com/tpoignonec/md2latex/issues"

[project.scripts]
md2latex = "md2latex.cli:main"

[tool.setuptools]
packages = ["md2latex"]
package-dir = {"" = "src"}

[tool.setuptools_scm]
write_to = "src/md2latex/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=md2latex",
    "--cov-report=html",
    "--cov-report=term-missing",
]

[tool.black]
line-length = 79
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true